name: Run Haskell Tests
author: Simon Hengel
description: Run all tests of a Haskell package

branding:
  icon: check-square
  color: green

inputs:
  ghc:
    description: GHC binary
    required: false
    default: ghc

  caching:
    description: Cache dependencies
    required: false
    default: false

  strict:
    description: Run with --strict
    required: false
    default: false

runs:
  using: composite
  steps:
    - shell: bash
      run: cabal update

    - shell: bash
      run: "[ -f cabal.project ] || cabal configure --enable-tests --enable-benchmarks"

    - shell: bash
      run: cabal build all --dry-run -w ${{ inputs.ghc }}
      if: inputs.caching == 'true'

    - shell: bash
      run: echo "version=`${{ inputs.ghc }} --numeric-version`" >> $GITHUB_OUTPUT
      id: ghc
      if: inputs.caching == 'true'

    - shell: bash
      run: echo "store-dir=`cabal -v0 path --store-dir`" >> $GITHUB_OUTPUT
      id: cabal-path
      if: inputs.caching == 'true'

    - uses: actions/cache/restore@v3
      id: cache
      env:
        key: ${{ runner.os }}-ghc-${{ steps.ghc.outputs.version }}
      with:
        path: ${{ steps.cabal-path.outputs.store-dir }}/ghc-${{ steps.ghc.outputs.version }}*
        key: ${{ env.key }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
        restore-keys: ${{ env.key }}-
      if: inputs.caching == 'true'

    - shell: bash
      run: cabal build all --only-dependencies -w ${{ inputs.ghc }}
      if: inputs.caching == 'true'

    - uses: actions/cache/save@v3
      with:
        path: ${{ steps.cabal-path.outputs.store-dir }}/ghc-${{ steps.ghc.outputs.version }}*
        key: ${{ steps.cache.outputs.cache-primary-key }}
      if: inputs.caching == 'true' && steps.cache.outputs.cache-hit != 'true'

    - shell: bash
      run: cabal build all -w ${{ inputs.ghc }}

    - shell: bash
      run: echo "HSPEC_STRICT=yes" >> $GITHUB_ENV
      if: inputs.strict == 'true'
    - shell: bash
      run: cabal test all --test-show-details=direct -w ${{ inputs.ghc }}
